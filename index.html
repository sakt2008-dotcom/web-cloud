    <script>
      // Self-heal if an older Service Worker ever intercepted Firebase reserved /__/auth/* paths
      (function() {
        try {
          if (window.location && window.location.pathname && window.location.pathname.indexOf('/__/') === 0) {
            var guardKey = '__amasa_auth_sw_healed';
            if (!sessionStorage.getItem(guardKey)) {
              sessionStorage.setItem(guardKey, '1');
              var tasks = [];
              if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
                tasks.push(
                  navigator.serviceWorker.getRegistrations().then(function(regs) {
                    return Promise.all(regs.map(function(r) { return r.unregister(); }));
                  })
                );
              }
              if ('caches' in window && caches.keys) {
                tasks.push(
                  caches.keys().then(function(names) {
                    return Promise.all(names.map(function(n) { return caches.delete(n); }));
                  })
                );
              }
              Promise.all(tasks).finally(function() {
                window.location.replace(window.location.href);
              });
            }
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Prevent Vite HMR WebSocket connection failure in cloud iframe environment
      (function() {
        try {
          const OrigWebSocket = window.WebSocket;
          if (OrigWebSocket) {
            window.WebSocket = function(url, protocols) {
              if (protocols === 'vite-hmr' || (typeof url === 'string' && url.includes('vite'))) {
                const fakeWs = new EventTarget();
                fakeWs.readyState = 1;
                fakeWs.OPEN = 1;
                fakeWs.CLOSED = 3;
                fakeWs.CLOSING = 2;
                fakeWs.CONNECTING = 0;
                fakeWs.send = function() {};
                fakeWs.close = function() {};
                setTimeout(function() {
                  fakeWs.dispatchEvent(new Event('open'));
                }, 5);
                return fakeWs;
              }
              return new OrigWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OrigWebSocket.prototype;
            window.WebSocket.OPEN = OrigWebSocket.OPEN;
            window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
            window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
            window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          }
        } catch (e) {}

        window.addEventListener('unhandledrejection', function(e) {
          const reason = e ? e.reason : null;
          const msg = reason ? (reason.message || String(reason)) : '';
          if (typeof msg === 'string' && msg.includes('WebSocket closed without opened')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(e) {
          const msg = e ? (e.message || String(e)) : '';
          if (typeof msg === 'string' && msg.includes('WebSocket closed without opened')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        const origError = console.error;
        console.error = function() {
          const args = Array.prototype.slice.call(arguments);
          if (args.some(function(a) {
            return (typeof a === 'string' && a.includes('WebSocket closed without opened')) ||
                   (a && a.message && String(a.message).includes('WebSocket closed without opened'));
          })) {
            return;
          }
          origError.apply(console, args);
        };
      })();
    </script>
